name: Release

# Runs after CI finishes on main. If VERSION names a version that has no tag
# yet, it builds remixware for Linux, macOS and Windows, smoke-tests every
# build it can run (a real index, scan and check of the fixture projects),
# and only then tags the commit and publishes. Archive names carry no
# version, so releases/latest/download links never change.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild the assets of an existing tag (for example v0.1.0)"
        required: false

permissions:
  contents: write

# One release run at a time, so two quick pushes cannot race to publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        env:
          REBUILD_TAG: ${{ github.event.inputs.tag }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          sha=$(git rev-parse HEAD)
          if [ -z "$REBUILD_TAG" ] && git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released; nothing to do"
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64, ext: "",     archive: tar.gz, smoke: true }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, ext: "",     archive: tar.gz, smoke: true }
          - { os: macos-latest,     goos: darwin,  goarch: arm64, ext: "",     archive: tar.gz, smoke: true }
          - { os: macos-latest,     goos: darwin,  goarch: amd64, ext: "",     archive: tar.gz, smoke: false }
          - { os: windows-latest,   goos: windows, goarch: amd64, ext: ".exe", archive: zip,    smoke: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build
        run: |
          set -eux
          mkdir -p stage
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o stage/remixware${{ matrix.ext }} ./cmd/remixware
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md CHANGELOG.md stage/
      - name: Smoke test
        if: matrix.smoke
        run: |
          set -eux
          rw=stage/remixware${{ matrix.ext }}
          out=$($rw version)
          [ "$(echo "$out" | tr -d '\r')" = "remixware ${{ needs.plan.outputs.version }}" ] || { echo "::error::version printed $out"; exit 1; }
          # Output goes to a file before grep reads it: with pipefail, grep -q
          # closing a pipe early makes the writer die of SIGPIPE.
          $rw licenses > licenses.txt
          grep -q "GPL-3.0-only" licenses.txt || { echo "::error::licenses does not list GPL-3.0-only"; exit 1; }
          $rw index testdata/upstream --out smoke.rmx > index.txt 2>&1 || { sed 's/^/::error::/' index.txt | head -20; exit 1; }
          grep -q "Indexed 10 files" index.txt || { sed 's/^/::error::/' index.txt | head -20; exit 1; }
          # check must fail on a project with licence conflicts, and pass on a clean one.
          set +e
          $rw check testdata/projects/shopfront --index smoke.rmx --html smoke.html > check.txt 2>&1
          code=$?
          set -e
          cat check.txt
          [ $code = 1 ] || { echo "::error::check on shopfront exited $code, want 1"; exit 1; }
          grep -q "internal/files/order.go:7-46" check.txt || { echo "::error::check missed the GPL copy"; exit 1; }
          [ -s smoke.html ] || { echo "::error::no HTML report"; exit 1; }
          $rw check testdata/projects/clean --index smoke.rmx > clean.txt 2>&1 || { sed 's/^/::error::/' clean.txt | head -20; exit 1; }
          grep -q "PASS" clean.txt || { echo "::error::check on clean did not pass"; exit 1; }
          $rw scan testdata/projects/shopfront --from testdata/scanoss/shopfront.json > scanoss.txt 2>&1 || { sed 's/^/::error::/' scanoss.txt | head -20; exit 1; }
          grep -q "4 findings" scanoss.txt || { echo "::error::SCANOSS import gave other findings"; exit 1; }
          # A check with nothing to scan must not pass.
          mkdir -p empty
          set +e
          $rw check empty --index smoke.rmx > empty.txt 2>&1
          code=$?
          set -e
          [ $code = 2 ] || { echo "::error::check on an empty folder exited $code, want 2"; sed 's/^/::error::/' empty.txt | head -5; exit 1; }
          # The dependency gate must fail the fixture change and pass an unchanged set.
          set +e
          $rw deps testdata/deps/head --base testdata/deps/base > deps.txt 2>&1
          code=$?
          set -e
          [ $code = 1 ] || { echo "::error::deps on the fixture change exited $code, want 1"; sed 's/^/::error::/' deps.txt | head -20; exit 1; }
          grep -q "FAIL: 3 changes break the policy" deps.txt || { sed 's/^/::error::/' deps.txt | head -40; exit 1; }
          $rw deps testdata/deps/base --base testdata/deps/base > deps-same.txt 2>&1 || { sed 's/^/::error::/' deps-same.txt | head -20; exit 1; }
      - name: Package
        run: |
          set -eux
          mkdir -p dist
          name=remixware_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd stage && 7z a -tzip ../dist/$name.zip * >/dev/null)
          else
            tar -czf dist/$name.tar.gz -C stage .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: remixware_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the archives
        run: |
          set -eu
          n=$(ls dist | wc -l)
          [ "$n" = 5 ] || { echo "::error::expected 5 archives, found $n: $(ls dist | tr '\n' ' ')"; exit 1; }
          for f in dist/*.tar.gz; do
            tar -tzf "$f" > list.txt
            grep -q '^./remixware$' list.txt || { echo "::error::$f has no remixware binary"; exit 1; }
          done
          unzip -l dist/remixware_windows_amd64.zip > list.txt
          grep -q 'remixware.exe' list.txt || { echo "::error::zip has no remixware.exe"; exit 1; }
      - name: Checksums
        run: |
          set -eux
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          v=${{ needs.plan.outputs.version }}
          awk "/^## $v/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          # Job logs can't be read from the maintainer's sessions, so any
          # failure is repeated as annotations.
          fail() { echo "::error::$1"; sed 's/^/::error::/' out.txt | head -20; exit 1; }
          if gh release view "v$v" > out.txt 2>&1; then
            gh release upload "v$v" dist/* --clobber > out.txt 2>&1 || fail "gh release upload failed"
          else
            git tag "v$v" "${{ needs.plan.outputs.sha }}"
            git push origin "refs/tags/v$v" > out.txt 2>&1 || fail "git push of tag v$v failed"
            gh release create "v$v" dist/* --verify-tag \
              --title "Remixware v$v" --notes-file notes.md > out.txt 2>&1 || fail "gh release create failed"
          fi
          cat out.txt
