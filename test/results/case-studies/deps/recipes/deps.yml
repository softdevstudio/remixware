name: Dependency gate
on: pull_request

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Remixware
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/softdevstudio/remixware/releases/latest/download/remixware_linux_amd64.tar.gz \
            | tar -xz -C "$HOME/bin" ./remixware
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Check dependency changes
        run: remixware deps . --base-ref "origin/${{ github.base_ref }}" --base-policy --json deps.json
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-gate
          path: deps.json
